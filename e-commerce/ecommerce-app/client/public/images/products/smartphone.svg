<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Two modern smartphones: one showing a lavender back with dual camera, one showing a colorful home screen">
  <title>Smartphone</title>
  <defs>
    <filter id="ph-blur" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="ph-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="ph-rail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ph-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.5" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="ph-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ph-module" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="ph-lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="ph-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ph-wall" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.35" stop-color="#3B82F6"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="ph-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ph-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ph-screen-clip">
      <rect x="-77" y="-163" width="154" height="326" rx="26"/>
    </clipPath>
    <clipPath id="ph-back-clip">
      <rect x="-81" y="-167" width="162" height="334" rx="29"/>
    </clipPath>
  </defs>
  <ellipse cx="316" cy="486" rx="160" ry="12" fill="#0F172A" opacity="0.14" filter="url(#ph-blur)"/>

  <!-- back phone (rear view) -->
  <g transform="translate(244 278) rotate(-10)">
    <rect x="-86.5" y="-120" width="4" height="36" rx="2" fill="#818CF8"/>
    <rect x="-86.5" y="-72" width="4" height="36" rx="2" fill="#818CF8"/>
    <rect x="-84" y="-170" width="168" height="340" rx="32" fill="url(#ph-rail)"/>
    <rect x="-81" y="-167" width="162" height="334" rx="29" fill="url(#ph-back)"/>
    <g clip-path="url(#ph-back-clip)">
      <path d="M-20 -170 L40 -170 L-60 170 L-120 170 Z" fill="url(#ph-sheen)" opacity="0.7"/>
    </g>
    <rect x="-68" y="-150" width="62" height="110" rx="26" fill="#6366F1" opacity="0.35" filter="url(#ph-soft)" transform="translate(2 4)"/>
    <rect x="-68" y="-152" width="62" height="110" rx="26" fill="url(#ph-module)"/>
    <rect x="-67" y="-151" width="60" height="108" rx="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    <g>
      <circle cx="-37" cy="-121" r="19" fill="#334155"/>
      <circle cx="-37" cy="-121" r="15" fill="#0F172A"/>
      <circle cx="-37" cy="-121" r="11" fill="url(#ph-lens)"/>
      <circle cx="-41" cy="-125" r="3" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="-37" cy="-73" r="19" fill="#334155"/>
      <circle cx="-37" cy="-73" r="15" fill="#0F172A"/>
      <circle cx="-37" cy="-73" r="11" fill="url(#ph-lens)"/>
      <circle cx="-41" cy="-77" r="3" fill="#FFFFFF" opacity="0.75"/>
    </g>
    <circle cx="10" cy="-132" r="7.5" fill="#FFFBEB" stroke="#A5B4FC" stroke-width="2"/>
    <circle cx="10" cy="-108" r="2.6" fill="#64748B"/>
  </g>

  <!-- front phone (screen) -->
  <g transform="translate(366 304) rotate(5)">
    <rect x="84" y="-110" width="4.5" height="52" rx="2" fill="#334155"/>
    <rect x="-88.5" y="-128" width="4.5" height="30" rx="2" fill="#334155"/>
    <rect x="-88.5" y="-88" width="4.5" height="30" rx="2" fill="#334155"/>
    <rect x="-84" y="-170" width="168" height="340" rx="32" fill="url(#ph-frame)"/>
    <rect x="-82" y="-168" width="164" height="336" rx="30" fill="#0F172A"/>
    <g clip-path="url(#ph-screen-clip)">
      <rect x="-77" y="-163" width="154" height="326" fill="url(#ph-wall)"/>
      <circle cx="52" cy="-120" r="90" fill="url(#ph-glow)" opacity="0.8"/>
      <path d="M-77 30 C-40 -10 10 70 77 10 L77 163 L-77 163 Z" fill="#06B6D4" opacity="0.35"/>
      <path d="M-77 90 C-30 50 30 120 77 70 L77 163 L-77 163 Z" fill="#F59E0B" opacity="0.3"/>
      <path d="M-77 -30 C-20 -70 30 20 77 -40" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>
      <text x="0" y="-104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" opacity="0.85" text-anchor="middle">Friday, September 25</text>
      <text x="0" y="-60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="600" fill="#FFFFFF" text-anchor="middle">9:41</text>
      <rect x="-66" y="108" width="132" height="42" rx="16" fill="#FFFFFF" opacity="0.24"/>
      <rect x="-60" y="116" width="26" height="26" rx="8" fill="#10B981"/>
      <rect x="-29" y="116" width="26" height="26" rx="8" fill="#F59E0B"/>
      <rect x="2" y="116" width="26" height="26" rx="8" fill="#3B82F6"/>
      <rect x="33" y="116" width="26" height="26" rx="8" fill="#F8FAFC"/>
      <path d="M-53 127 a6 5 0 1 1 3 4.3 l-4 2 z" fill="#FFFFFF"/>
      <circle cx="-16" cy="129" r="6" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
      <rect x="9" y="123" width="12" height="12" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
      <circle cx="46" cy="129" r="6" fill="#F43F5E"/>
      <rect x="-20" y="-156" width="40" height="12" rx="6" fill="#0F172A"/>
      <rect x="-77" y="-163" width="154" height="326" fill="url(#ph-glass)"/>
    </g>
  </g>
</svg>
