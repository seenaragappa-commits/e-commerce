<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Over-ear wireless headphones in matte charcoal with blue accent rings">
  <title>Wireless Headphones</title>
  <defs>
    <filter id="hp-blur" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="hp-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="hp-pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="hp-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="hp-yoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="hp-shell" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </radialGradient>
    <radialGradient id="hp-plate" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1E293B"/>
    </radialGradient>
    <linearGradient id="hp-cush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.55" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <ellipse cx="300" cy="488" rx="182" ry="12" fill="#0F172A" opacity="0.14" filter="url(#hp-blur)"/>
  <g transform="translate(0 14)">
    <!-- headband cushion -->
    <path d="M165.5 212 C160 150 214 98 300 98 C386 98 440 150 434.5 212 C434.5 226 406.5 226 406.5 212 C407 160 360 126 300 126 C240 126 193 160 193.5 212 C193.5 226 165.5 226 165.5 212 Z" fill="url(#hp-pad)"/>
    <path d="M185 212 C184 158 234 117 300 117 C366 117 416 158 415 212" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.6"/>
    <!-- sliders -->
    <rect x="161" y="226" width="14" height="58" rx="5" fill="url(#hp-metal)"/>
    <rect x="425" y="226" width="14" height="58" rx="5" fill="url(#hp-metal)"/>
    <!-- headband shell -->
    <path d="M168 234 C152 150 214 98 300 98 C386 98 448 150 432 234" fill="none" stroke="url(#hp-band)" stroke-width="20" stroke-linecap="round"/>
    <path d="M163.5 186 C160 140 225 92 296 94" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
    <!-- hinges -->
    <path d="M146 298 C148 280 156 266 168 266 C180 266 196 280 204 298 Z" fill="url(#hp-yoke)"/>
    <path d="M396 298 C404 280 420 266 432 266 C444 266 452 280 454 298 Z" fill="url(#hp-yoke)"/>
    <circle cx="168" cy="280" r="4" fill="url(#hp-metal)"/>
    <circle cx="432" cy="280" r="4" fill="url(#hp-metal)"/>
    <!-- left cup -->
    <ellipse cx="216" cy="376" rx="48" ry="82" fill="url(#hp-cush)"/>
    <path d="M238 304 C256 322 264 350 264 376" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="182" cy="373" rx="58" ry="88" fill="#1E293B"/>
    <ellipse cx="168" cy="372" rx="58" ry="88" fill="url(#hp-shell)"/>
    <ellipse cx="168" cy="372" rx="46" ry="72" fill="none" stroke="#3B82F6" stroke-width="3"/>
    <ellipse cx="168" cy="372" rx="40" ry="65" fill="url(#hp-plate)"/>
    <path d="M122 330 C128 306 144 290 162 286" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
    <!-- right cup -->
    <ellipse cx="384" cy="376" rx="48" ry="82" fill="url(#hp-cush)"/>
    <ellipse cx="418" cy="373" rx="58" ry="88" fill="#1E293B"/>
    <ellipse cx="432" cy="372" rx="58" ry="88" fill="url(#hp-shell)"/>
    <ellipse cx="432" cy="372" rx="46" ry="72" fill="none" stroke="#3B82F6" stroke-width="3"/>
    <ellipse cx="432" cy="372" rx="40" ry="65" fill="url(#hp-plate)"/>
    <path d="M386 330 C392 306 408 290 426 286" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.22"/>
  </g>
</svg>
