<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Smart watch with dark slate case, digital watch face showing 10:09 and a blue sport band">
  <title>Smart Watch</title>
  <defs>
    <filter id="sw-blur" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="sw-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sw-fade-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sw-fade-bot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sw-case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="0.45" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="sw-screen" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="sw-gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sw-crown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <clipPath id="sw-glass">
      <rect x="216" y="206" width="168" height="196" rx="42"/>
    </clipPath>
  </defs>
  <ellipse cx="300" cy="500" rx="118" ry="11" fill="#0F172A" opacity="0.14" filter="url(#sw-blur)"/>
  <!-- straps -->
  <path d="M226 230 C227 170 229 128 233 104 C235 92 245 86 257 86 L343 86 C355 86 365 92 367 104 C371 128 373 170 374 230 Z" fill="url(#sw-band)"/>
  <path d="M226 230 C227 170 229 128 233 104 C235 92 245 86 257 86 L343 86 C355 86 365 92 367 104 C371 128 373 170 374 230 Z" fill="url(#sw-fade-top)"/>
  <path d="M226 380 C227 430 229 460 233 476 C235 486 245 492 257 492 L343 492 C355 492 365 486 367 476 C371 460 373 430 374 380 Z" fill="url(#sw-band)"/>
  <path d="M226 380 C227 430 229 460 233 476 C235 486 245 492 257 492 L343 492 C355 492 365 486 367 476 C371 460 373 430 374 380 Z" fill="url(#sw-fade-bot)"/>
  <path d="M238 112 C236 140 235 170 235 196" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <path d="M235 424 C235 440 236 456 238 468" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <g fill="#1E3A8A" opacity="0.55">
    <circle cx="300" cy="438" r="4.5"/>
    <circle cx="300" cy="455" r="4.5"/>
    <circle cx="300" cy="472" r="4.5"/>
  </g>
  <!-- crown and button -->
  <rect x="392" y="252" width="18" height="42" rx="6" fill="url(#sw-crown)"/>
  <g stroke="#475569" stroke-width="1.2" opacity="0.6">
    <line x1="399" y1="259" x2="409" y2="259"/>
    <line x1="399" y1="265" x2="409" y2="265"/>
    <line x1="399" y1="271" x2="409" y2="271"/>
    <line x1="399" y1="277" x2="409" y2="277"/>
    <line x1="399" y1="283" x2="409" y2="283"/>
    <line x1="399" y1="289" x2="409" y2="289"/>
  </g>
  <rect x="393" y="314" width="11" height="44" rx="5" fill="#334155"/>
  <!-- case -->
  <rect x="202" y="192" width="196" height="224" rx="54" fill="url(#sw-case)"/>
  <rect x="204.5" y="194.5" width="191" height="219" rx="51.5" fill="none" stroke="#CBD5E1" stroke-width="1.5" opacity="0.35"/>
  <rect x="210" y="200" width="180" height="208" rx="47" fill="#0F172A"/>
  <!-- screen -->
  <rect x="216" y="206" width="168" height="196" rx="42" fill="url(#sw-screen)"/>
  <text x="300" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" fill="#60A5FA" text-anchor="middle">WED 25</text>
  <text x="300" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="600" letter-spacing="-1" fill="#F8FAFC" text-anchor="middle">10:09</text>
  <g fill="none" stroke-width="4.5" stroke-linecap="round">
    <circle cx="264" cy="354" r="17" stroke="#F43F5E" opacity="0.25"/>
    <circle cx="264" cy="354" r="11.5" stroke="#10B981" opacity="0.25"/>
    <circle cx="264" cy="354" r="6" stroke="#3B82F6" opacity="0.3"/>
    <circle cx="264" cy="354" r="17" stroke="#F43F5E" stroke-dasharray="80 107" transform="rotate(-90 264 354)"/>
    <circle cx="264" cy="354" r="11.5" stroke="#10B981" stroke-dasharray="58 73" transform="rotate(-90 264 354)"/>
    <circle cx="264" cy="354" r="6" stroke="#3B82F6" stroke-dasharray="22 38" transform="rotate(-90 264 354)"/>
  </g>
  <text x="292" y="352" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">8,204</text>
  <text x="292" y="368" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#94A3B8">STEPS</text>
  <!-- glass reflection -->
  <g clip-path="url(#sw-glass)">
    <path d="M216 206 L330 206 L216 330 Z" fill="url(#sw-gloss)"/>
  </g>
</svg>
