<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Slim fitness tracker band in dark slate with a pill-shaped screen showing a heart rate of 72 bpm">
  <title>Fitness Band</title>
  <defs>
    <filter id="fb-blur" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="fb-soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <linearGradient id="fb-front" x1="128" y1="0" x2="472" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.18" stop-color="#334155"/>
      <stop offset="0.38" stop-color="#475569"/>
      <stop offset="0.62" stop-color="#334155"/>
      <stop offset="0.86" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fb-inner" x1="0" y1="182" x2="0" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fb-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.5" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="fb-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fb-bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fb-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="300" cy="412" rx="190" ry="14" fill="#0F172A" opacity="0.15" filter="url(#fb-blur)"/>
  <ellipse cx="300" cy="300" rx="150" ry="36" fill="#0F172A" opacity="0.1" filter="url(#fb-soft)"/>
  <!-- inner surface of the back half of the band -->
  <path d="M128 260 A172 78 0 0 1 472 260 L472 316 A172 78 0 0 0 128 316 Z" fill="url(#fb-inner)"/>
  <g fill="#0F172A" opacity="0.7">
    <ellipse cx="256" cy="212" rx="3.2" ry="4.6"/>
    <ellipse cx="278" cy="210.5" rx="3.2" ry="4.6"/>
    <ellipse cx="300" cy="210" rx="3.2" ry="4.6"/>
    <ellipse cx="322" cy="210.5" rx="3.2" ry="4.6"/>
    <ellipse cx="344" cy="212" rx="3.2" ry="4.6"/>
  </g>
  <!-- outer surface of the front half -->
  <path d="M128 260 A172 78 0 0 0 472 260 L472 316 A172 78 0 0 1 128 316 Z" fill="url(#fb-front)"/>
  <!-- rim (top edge of band) -->
  <ellipse cx="300" cy="260" rx="172" ry="78" fill="none" stroke="#64748B" stroke-width="2.5"/>
  <path d="M150 300 A172 78 0 0 0 250 336" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- module -->
  <path d="M204 308.7 A172 78 0 0 0 396 308.7 A30 42 0 0 1 396 392.7 A172 78 0 0 1 204 392.7 A30 42 0 0 1 204 308.7 Z" fill="url(#fb-rim)"/>
  <path d="M208 312.5 A172 78 0 0 0 392 312.5 A27 38.5 0 0 1 392 389.5 A172 78 0 0 1 208 389.5 A27 38.5 0 0 1 208 312.5 Z" fill="#0F172A"/>
  <path d="M216 320.1 A172 78 0 0 0 384 320.1 A22 34 0 0 1 384 388.1 A172 78 0 0 1 216 388.1 A22 34 0 0 1 216 320.1 Z" fill="url(#fb-screen)"/>
  <!-- screen content -->
  <path d="M0 7 C-9 0 -12 -5 -12 -9 C-12 -14 -8 -17 -4.5 -17 C-2 -17 -0.5 -15.5 0 -14 C0.5 -15.5 2 -17 4.5 -17 C8 -17 12 -14 12 -9 C12 -5 9 0 0 7 Z" fill="#F43F5E" transform="translate(244 366)"/>
  <text x="264" y="377" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#F8FAFC">72</text>
  <text x="264" y="391" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#94A3B8">BPM</text>
  <g fill="url(#fb-bars)">
    <rect x="320" y="364" width="5" height="12" rx="2"/>
    <rect x="328" y="358" width="5" height="18" rx="2"/>
    <rect x="336" y="362" width="5" height="14" rx="2"/>
    <rect x="344" y="352" width="5" height="24" rx="2"/>
    <rect x="352" y="358" width="5" height="18" rx="2"/>
    <rect x="360" y="348" width="5" height="28" rx="2"/>
  </g>
  <rect x="319" y="379" width="47" height="2" rx="1" fill="#14B8A6" opacity="0.5"/>
  <!-- glass reflection -->
  <path d="M216 320.1 A172 78 0 0 0 384 320.1 A22 34 0 0 1 402 340 C340 352 270 352 200 342 A22 34 0 0 1 216 320.1 Z" fill="url(#fb-gloss)"/>
</svg>
